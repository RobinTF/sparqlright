[package]
name = "sparqlright-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "C API of SPARQLright for in-process, coverage-guided fuzzing harnesses"
license = "Apache-2.0"
publish = false

[lib]
name = "sparqlright_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
sparqlright = { path = ".." }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
